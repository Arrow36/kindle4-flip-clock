SETTINGS_VERSION=4

# Defaults match the approved preview.
ORIENTATION=landscape_left
HOUR_MODE=12
THEME=dark
# POSIX TZ syntax. China Standard Time is UTC+8 (the sign is reversed).
TIMEZONE=CST-8

# Manual synchronization (Keyboard key). Wi-Fi is enabled only for KOReader's
# LuaSocket SNTP client and is disabled again when the attempt finishes.
TIME_SYNC_TIMEOUT=45
NTP_SERVERS="ntp1.aliyun.com ntp2.aliyun.com ntp.aliyun.com"

# Stay awake for one minute after startup or the most recent physical key.
# Afterwards, RTC suspend is used between minute updates; Power wakes it.
IDLE_SUSPEND_SECONDS=60
RTC_WAKE_LEAD_SECONDS=3

# Estimated visible E Ink update durations. Refreshing starts half of the
# selected duration before the virtual minute boundary.
PARTIAL_REFRESH_DURATION_MS=800
FULL_REFRESH_DURATION_MS=1400

# Keep the Kindle awake after the hourly full refresh so the gas gauge can
# settle before the next displayed battery sample.
BATTERY_REFRESH_SETTLE_SECONDS=40

# Runtime diagnostics and persistent log rotation.
DEBUG_LOG=0
LOG_MAX_BYTES=524288
