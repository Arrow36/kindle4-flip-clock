SETTINGS_VERSION=6

# Packaged display defaults.
ORIENTATION=landscape_left
HOUR_MODE=24
THEME=dark
# POSIX TZ syntax. China Standard Time is UTC+8 (the sign is reversed).
TIMEZONE=CST-8

# KOReader LuaSocket SNTP servers and Wi-Fi connection timeout.
TIME_SYNC_TIMEOUT=45
NTP_SERVERS="ntp1.aliyun.com ntp2.aliyun.com ntp.aliyun.com"
# Zero disables automatic synchronization; positive values are the minimum
# hours since the last successful synchronization, checked at each hour.
AUTO_TIME_SYNC_INTERVAL_HOURS=1
# Passive hourly checks never set the system clock. Keep disabled unless
# collecting clock-drift diagnostics.
AUTO_TIME_CHECK_HOURLY=0
# Compensate the observed fast Kindle 4 suspend/resume wall clock (scaled by voltage).
RTC_DRIFT_COMPENSATION_PPM=5400
# Dynamically calibrate drift PPM from hourly SNTP measurements (closed-loop).
AUTO_DRIFT_CALIBRATION=1

# Enter RTC suspend shortly after the last key and wake before each minute.
IDLE_SUSPEND_SECONDS=15
RTC_WAKE_LEAD_SECONDS=3

# Estimated visible E Ink update durations.
PARTIAL_REFRESH_DURATION_MS=800
FULL_REFRESH_DURATION_MS=1400

# Keep the Kindle awake after the hourly full refresh before sampling battery.
BATTERY_REFRESH_SETTLE_SECONDS=25

# Runtime diagnostics and persistent log rotation.
DEBUG_LOG=0
LOG_MAX_BYTES=4194304
